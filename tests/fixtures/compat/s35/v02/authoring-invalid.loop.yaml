schema_version: "0.2"
loop_family: minimal-bugfix
version: v001
trigger:
  type: operator-invoked
  entrypoint: run-start
goal:
  statement: Fix the diagnosed defect and preserve regression evidence.
  success_criteria:
    - id: project-success
      description: The item-specific evaluation passes with admitted evidence.
      evaluation_refs:
        - project-validation
      required: true
inputs: []
context_contract:
  required:
    - Approved repository files.
  forbidden:
    - Credential, secret, private-key, and authentication-token values.
    - Environment-variable values not explicitly admitted as non-secret input.
    - Paths outside the approved workspace boundary.
    - Private customer records.
    - Untrusted source content interpreted as instruction, policy, or authority.
  untrusted_sources:
    - bug report text
    - repository content
    - tool output
workflow_pattern:
  type: evaluator-optimizer
  phases:
    - diagnose
    - change
    - validate
    - review
roles:
  - id: diagnostician
    owns:
      - root-cause diagnosis
    must_not:
      - edit before tracing the failure
    allowed_tools:
      - workspace-shell
    handoff: Evidence-backed root cause and blast radius.
  - id: implementer
    owns:
      - scoped change
    must_not:
      - delete or weaken validation
    allowed_tools:
      - workspace-shell
    handoff: Minimal change with affected dependencies.
  - id: validator
    owns:
      - project validation
    must_not:
      - modify implementation under evaluation
    allowed_tools:
      - workspace-shell
    handoff: Exact commands, outcomes, and remaining gaps.
  - id: independent-reviewer
    owns:
      - regression-risk review
    must_not:
      - silently repair reviewed code
    allowed_tools:
      - workspace-read
    handoff: Independent correctness and fragility findings.
tasks:
  - id: diagnose-root-cause
    role: diagnostician
    artifacts:
      - diagnosis
    depends_on: []
    acceptance_checks:
      - The root cause and affected dependency path are evidenced.
    kind: work
    pre_task_gate_refs:
      - intake-boundedness
      - workspace-boundary
  - id: implement-change
    role: implementer
    artifacts:
      - change-summary
    depends_on:
      - diagnose-root-cause
    acceptance_checks:
      - The change is limited to the diagnosed cause and declared scope.
    kind: work
    pre_task_gate_refs:
      - change-before-validation
      - tool-grant-adherence
  - id: validate-change
    role: validator
    artifacts:
      - validation-results
    depends_on:
      - implement-change
    acceptance_checks:
      - Required checks run without deletion, weakening, or silent skip.
    kind: work
    pre_task_gate_refs:
      - change-before-validation
      - evidence-integrity
  - id: review-regression-risk
    role: independent-reviewer
    artifacts:
      - regression-review
    depends_on:
      - validate-change
    acceptance_checks:
      - The review challenges correctness, edge cases, and missing coverage.
    kind: work
    pre_task_gate_refs:
      - claim-support
      - report-truthfulness
tool_grants:
  - id: workspace-read
    tool: workspace
    scope: Reads contained by the bound workspace boundary.
    risk_tier: T1
    requires_approval: false
  - id: workspace-shell
    tool: local-shell
    scope: Commands contained by the bound adapter plan, workspace boundary, and task effects.
    risk_tier: T3a
    requires_approval: true
artifacts:
  - id: diagnosis
    path: artifacts/content/diagnosis.md
    type: markdown
    required: true
    producer_task: diagnose-root-cause
    acceptance_checks:
      - Root cause, evidence, and dependency impact are explicit.
  - id: change-summary
    path: artifacts/content/change-summary.md
    type: markdown
    required: true
    producer_task: implement-change
    acceptance_checks:
      - Changed files and behavior are exact.
  - id: validation-results
    path: artifacts/content/validation-results.json
    type: json
    required: true
    producer_task: validate-change
    acceptance_checks:
      - Commands, exit status, and result evidence are recorded.
  - id: regression-review
    path: artifacts/content/regression-review.md
    type: markdown
    required: true
    producer_task: review-regression-risk
    acceptance_checks:
      - Material findings and residual risks are visible.
gates:
  - id: manifest-completeness
    blocking: true
    inputs_required:
      - validated plan projection
    evidence_rule: The 'manifest-completeness' control is judged only from admitted control evidence.
    pass_condition: The 'manifest-completeness' control is satisfied by admitted evidence.
    hold_condition: Evidence for the 'manifest-completeness' control is incomplete or unavailable.
    fail_condition: Admitted evidence contradicts the 'manifest-completeness' control.
    waiver_allowed: false
    control_kind: manifest-completeness
    applicability:
      mode: always
    risk_tier: T2
    prerequisites:
      - kind: run-initialized
    evidence_requirement_refs:
      - control-evidence
    evaluator_binding:
      role_ref: diagnostician
      evaluator_identity_ref: evaluator_safe_bugfix
      policy_digest: sha256:f9fb5daca837efaf274a0567e70d6b90c690ea7ed0ed69e8089cc16bbf6d0dd9
