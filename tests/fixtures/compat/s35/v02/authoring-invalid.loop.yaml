      export_check_role: null
evidence_requirements:
  - id: bugfix-evidence
    minimum_independent_roots: 1
    evidence_kinds:
      - command-capture
    source_acquisition_policy: null
  - id: control-evidence
    minimum_independent_roots: 1
    evidence_kinds:
      - manual-observation
    source_acquisition_policy: null
risk_controls:
  max_tier_without_approval: T2
  t5_allowed: false
progress:
  observations:
    - id: project-progress
      description: Track the item-specific evaluation result.
      source: evaluation
      source_ref: project-validation
      value_pointer: /passed
      value_type: boolean
      improves_when:
        operator: equals
        target: true
      target:
        operator: equals
        value: true
  stall_after_loop_attempts: 2
stop_policy:
  terminal_states:
    - state: aborted
      condition_mode: any
      conditions:
        - source: control
          ref: abort-requested
          outcome: present
      priority: 700
    - state: failed
      condition_mode: any
      conditions:
        - source: failure
          task_ref: diagnose-root-cause
          ref: invalid-input
          outcome: observed
      priority: 600
    - state: exhausted
      condition_mode: any
      conditions:
        - source: limit
          ref: max-loop-attempts
          outcome: reached
      priority: 500
    - state: stalled
      condition_mode: any
      conditions:
        - source: progress
          ref: project-progress
          outcome: stalled
      priority: 400
    - state: held
      condition_mode: any
      conditions:
        - source: gate
          ref: change-before-validation
          outcome: hold
      priority: 300
    - state: blocked
      condition_mode: any
      conditions:
        - source: failure
