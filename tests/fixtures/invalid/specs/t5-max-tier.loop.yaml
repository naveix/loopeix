# INVALID FIXTURE — expected to FAIL validation.
# Sole defect: risk_controls.max_tier_without_approval is "T5", i.e. T5 would run
# WITHOUT approval. V1 rejects T5 in every authoring position, not just t5_allowed.
schema_version: "0.1"
loop_family: "invalid-t5-max-tier"
version: "v001"

outcome:
  summary: "Invalid example: T5 is set as the max tier that runs without approval."
  success_criteria:
    - "This fixture must fail validation because T5 is rejected in V1."

inputs: []

context_contract:
  required:
    - "Relevant files"
  forbidden:
    - ".env contents unless explicitly approved"
  untrusted_sources: []

workflow_pattern:
  type: "orchestrator-workers"
  phases:
    - "inspect"
    - "fix"
    - "verify"

roles:
  - id: "fix-owner"
    owns:
      - "diagnosis"
      - "fix"
      - "verification"
    must_not:
      - "change unrelated files"
    allowed_tools:
      - "shell"
    handoff: "Summarize changes and evidence."

tasks:
  - id: "diagnose"
    role: "fix-owner"
    artifacts:
      - "diagnosis-note"
    depends_on: []
    acceptance_checks:
      - "Root cause recorded."

tool_grants:
  - id: "workspace-shell"
    tool: "shell"
    scope: "read and write inside approved workspace"
    risk_tier: "T2"
    requires_approval: false

artifacts:
  - id: "diagnosis-note"
    path: "artifacts/diagnosis.md"
    type: "markdown"
    required: true
    producer_task: "diagnose"
    acceptance_checks:
      - "States evidence used."

gates:
  - id: "claim-support"
    blocking: true
    inputs_required:
      - "diagnosis-note"
    evidence_rule: "Strong claims require command, file, citation, browser, or manual-review evidence."
    pass_condition: "All strong claims are supported."
    hold_condition: "Any strong claim is unsupported."
    fail_condition: "A claim is contradicted by evidence."
    waiver_allowed: false

evaluations:
  - id: "best-available-check"
    type: "command"
    required: true
    command: "project-specific"
    success_condition: "The selected check exits successfully or a limitation is recorded."

risk_controls:
  max_tier_without_approval: "T5"
  t5_allowed: false

retro:
  creates: "SpecChangeProposal"
