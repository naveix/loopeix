schema_version: "0.1"
loop_family: "seal-demo"
version: "v001"

outcome:
  summary: "Replay a captured engine run against a sealed brief and emit a signed receipt."
  success_criteria:
    - "The brief is sealed as ledger event 1."
    - "A signed receipt.json lands in the run directory."

inputs:
  - id: "captured-events"
    description: "The pre-captured Codex JSONL event stream to replay."
    required: true

context_contract:
  required:
    - "The captured event stream"
    - "The sealed brief"
  forbidden:
    - "Raw unredacted engine output"
  untrusted_sources: []

workflow_pattern:
  type: "prompt-chaining"
  phases:
    - "replay"
    - "adjudicate"
    - "seal"

roles:
  - id: "seal-runner"
    owns:
      - "replay"
      - "receipt emission"
    must_not:
      - "alter captured events"
    allowed_tools:
      - "shell"
    handoff: "Report the receipt path and verdict summary."

tasks:
  - id: "replay-and-seal"
    role: "seal-runner"
    artifacts:
      - "signed-receipt"
    depends_on: []
    acceptance_checks:
      - "receipt.json verifies offline."

tool_grants:
  - id: "workspace-shell"
    tool: "shell"
    scope: "read and write inside approved workspace"
    risk_tier: "T2"
    requires_approval: false

artifacts:
  - id: "signed-receipt"
    path: "receipt.json"
    type: "json"
    required: true
    producer_task: "replay-and-seal"
    acceptance_checks:
      - "Signature verifies against the embedded public key."

gates:
  - id: "evidence-present"
    blocking: true
    inputs_required:
      - "ev_0001"
    evidence_rule: "At least one command/file/tool evidence item was captured from the replayed stream."
    pass_condition: "Evidence ev_0001 exists."
    hold_condition: "No evidence was extracted from the stream."
    fail_condition: "Evidence extraction is broken."
    waiver_allowed: false

evaluations: []

risk_controls:
  max_tier_without_approval: "T2"
  t5_allowed: false

retro:
  creates: "SpecChangeProposal"
