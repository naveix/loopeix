name: Release to npm

# Publishes to npm with PROVENANCE via OIDC trusted publishing — no long-lived token in secrets.
# One-time setup on npmjs.com (operator): package loopeix → Settings → Trusted publisher →
# GitHub Actions → repository naveix/loopeix, workflow "release.yml", environment blank.
#
# Trigger: publishing a GitHub Release (the tag is the version source of truth).
# The job refuses to publish if the tag and package.json versions disagree.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing / provenance
    steps:
      # Actions pinned to commit SHAs (supply-chain: a moved tag cannot change what runs here).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Tag / version consistency gate
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "FATAL: release tag v$TAG != package.json version $PKG — refusing to publish."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build + test (full gate before anything leaves)
        run: pnpm build && pnpm test

      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      # npm publish runs on the TARBALL from a neutral cwd: the repo's devEngines field
      # intentionally blocks npm commands inside the project (pnpm-only discipline), and the
      # artifact being published is the packed tarball, not the working tree.
      - name: Publish with provenance
        working-directory: ${{ runner.temp }}
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

      - name: Verify the published version resolves
        run: |
          PKG=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          for i in 1 2 3 4 5; do
            LIVE=$(npm view "loopeix@$PKG" version 2>/dev/null || true)
            [ "$LIVE" = "$PKG" ] && { echo "live: loopeix@$LIVE"; exit 0; }
            sleep 15
          done
          echo "FATAL: loopeix@$PKG not resolvable on the registry after publish"; exit 1
