name: Release to npm

# Publishes to npm with PROVENANCE via OIDC trusted publishing — no long-lived token in secrets.
# One-time setup on npmjs.com (operator): package loopeix → Settings → Trusted publisher →
# GitHub Actions → repository naveix/loopeix, workflow "release.yml", environment "npm-release",
# and allow direct npm publishing (new publishers otherwise default to staged publishing).
#
# Trigger: publishing a GitHub Release (the tag is the version source of truth).
# The job refuses to publish if the tag and package.json versions disagree.

on:
  release:
    types: [published]

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      # Actions pinned to commit SHAs (supply-chain: a moved tag cannot change what runs here).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Prove stable tag identity, main ancestry, and exact CI gate
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "${{ github.event.release.prerelease }}" = "false"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "FATAL: release commit is not reachable from main — refusing to publish."
            exit 1
          }

          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "FATAL: release tag v$TAG != package.json version $PKG — refusing to publish."
            exit 1
          fi
          case "$PKG" in
            *-*)
              echo "FATAL: prerelease package version $PKG cannot publish through the stable latest workflow."
              exit 1
              ;;
          esac

          mapfile -t conclusions < <(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20%2F%20Release%20gate&filter=latest" \
              --jq '.check_runs[].conclusion'
          )
          test "${#conclusions[@]}" -ge 1 || {
            echo "FATAL: no CI / Release gate check exists for $GITHUB_SHA."
            exit 1
          }
          for conclusion in "${conclusions[@]}"; do
            test "$conclusion" = "success" || {
              echo "FATAL: CI / Release gate is '$conclusion', not success."
              exit 1
            }
          done
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Select exact npm client
        shell: bash
        run: |
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Refuse an existing registry version
        shell: bash
        run: |
          PKG="${{ steps.package.outputs.version }}"
          if npm view "loopeix@$PKG" version --json \
            >"$RUNNER_TEMP/npm-view.json" 2>"$RUNNER_TEMP/npm-view.err"; then
            echo "FATAL: loopeix@$PKG already exists on npm — refusing to republish."
            exit 1
          fi
          grep -q 'E404' "$RUNNER_TEMP/npm-view.err" || {
            echo "FATAL: npm registry state is unknown — refusing to publish."
            cat "$RUNNER_TEMP/npm-view.err"
            exit 1
          }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and run the complete source suite
        run: |
          pnpm build
          pnpm test
          node scripts/verify-s35-test-inventory.mjs

      - name: Verify architecture boundaries and mutation resistance
        run: |
          node scripts/check-s36-boundaries.mjs
          node scripts/check-s37-boundaries.mjs
          node scripts/check-s40-runtime-boundary.mjs
          node scripts/check-s41-recovery-boundary.mjs
          node scripts/test-s40-runtime-boundary.mjs
          node scripts/test-s41-recovery-boundary.mjs

      - name: Verify deterministic generated schemas
        run: |
          pnpm schema:generate
          git diff --exit-code -- schemas
          pnpm schema:generate
          git diff --exit-code -- schemas

      - name: Scan the release source for credentials
        run: >-
          node scripts/scan-secrets-s35.mjs
          --allowlist scripts/secret-scan-allowlist-s35.json
          --filenames-only
          --exclude-env
          --exclude-playwright
          .

      - name: Pack exactly one release artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/release-artifact"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          mapfile -t tarballs < <(find "$RUNNER_TEMP/pack" -maxdepth 1 -type f -name 'loopeix-*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          cp "${tarballs[0]}" "$RUNNER_TEMP/release-artifact/loopeix.tgz"
          (
            cd "$RUNNER_TEMP/release-artifact"
            sha256sum loopeix.tgz > loopeix.tgz.sha256
          )

      - name: Verify the exact packed artifact
        shell: bash
        run: |
          node scripts/smoke-packed-package-s35.mjs \
            --mode full \
            --tarball "$RUNNER_TEMP/release-artifact/loopeix.tgz" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/compat/s35"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-artifact
          path: ${{ runner.temp }}/release-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: ${{ github.event.release.prerelease == false }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      actions: read
      id-token: write # Exposed only to this minimal trusted-publisher job.
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-artifact
          path: ${{ runner.temp }}/release-artifact

      - name: Verify artifact digest and exact npm client
        working-directory: ${{ runner.temp }}/release-artifact
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          sha256sum --check loopeix.tgz.sha256
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Recheck registry state immediately before publish
        shell: bash
        run: |
          PKG="${{ needs.verify.outputs.version }}"
          if npm view "loopeix@$PKG" version --json \
            >"$RUNNER_TEMP/npm-view.json" 2>"$RUNNER_TEMP/npm-view.err"; then
            echo "FATAL: loopeix@$PKG already exists on npm — refusing to republish."
            exit 1
          fi
          grep -q 'E404' "$RUNNER_TEMP/npm-view.err" || {
            echo "FATAL: npm registry state is unknown — refusing to publish."
            cat "$RUNNER_TEMP/npm-view.err"
            exit 1
          }

      - name: Publish with provenance
        working-directory: ${{ runner.temp }}/release-artifact
        run: npm publish loopeix.tgz --provenance --access public --tag latest

      - name: Verify the published version resolves
        run: |
          PKG="${{ needs.verify.outputs.version }}"
          for i in 1 2 3 4 5; do
            LIVE=$(npm view "loopeix@$PKG" version 2>/dev/null || true)
            [ "$LIVE" = "$PKG" ] && { echo "live: loopeix@$LIVE"; exit 0; }
            sleep 15
          done
          echo "FATAL: loopeix@$PKG not resolvable on the registry after publish"; exit 1
