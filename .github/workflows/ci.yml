name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "22.12" is the declared engines floor — keep it pinned exactly so the
        # floor itself stays proven, not just the latest patch of 22.x.
        node-version: ["22.12", "26"]
    permissions:
      contents: read
    steps:
      # Actions pinned to commit SHAs (supply-chain: a moved tag cannot change what runs here).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (tsc, noEmitOnError)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

      - name: Validate golden spec fixtures via the CLI
        run: |
          fail=0
          for f in tests/fixtures/valid/specs/*.yaml examples/dogfood/*.yaml templates/*.yaml; do
            if ! ./bin/run.js spec validate "$f" >/dev/null; then echo "UNEXPECTED INVALID: $f"; fail=1; fi
          done
          for f in tests/fixtures/invalid/specs/*.yaml; do
            if ./bin/run.js spec validate "$f" >/dev/null 2>&1; then echo "UNEXPECTED VALID (should fail): $f"; fail=1; fi
          done
          exit $fail
